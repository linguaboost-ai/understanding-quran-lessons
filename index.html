<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23000'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23d9a441' stroke-width='2'/><circle cx='16' cy='16' r='2.6' fill='%23d9a441'/></svg>">
<title>Quran verstehen lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="start">
  <header class="kopf">
    <div class="ober">Videokurs</div>
    <h1>Quran verstehen lernen</h1>
    <p>Lektion auswählen. Im Player blättern die Pfeiltasten durch die Folien und
       ihre Aufdeckschritte, <b>Esc</b> führt zurück, <b>F</b> schaltet auf Vollbild.</p>
  </header>
  <main class="liste" id="liste"></main>

<script type="module">
import { parse } from './assets/parser.js';
const text = await (await fetch('Folien-Lektion-01-22.txt', {cache:'no-store'})).text();
const kurs = parse(text);
const liste = document.getElementById('liste');
for (const l of kurs){
  const a = document.createElement('a');
  a.className = 'lek';
  a.href = `lektion.html?l=${l.nr}`;
  const teile = [`${l.folien.length} Folien`];
  if (l.wurzeln.length) teile.push(`${l.wurzeln.length} Wurzel${l.wurzeln.length>1?'n':''}`);
  teile.push(`${l.hervorhebungen.length} Hervorhebung${l.hervorhebungen.length>1?'en':''}`);
  a.innerHTML = `<div class="nr">${l.nr}</div>
    <div><div class="ti">${l.titel}</div><div class="zu">${teile.join(' · ')}</div></div>`;
  liste.appendChild(a);
}
</script>
</body>
</html>
